name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Test Gate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Pin npm
        run: |
          corepack enable
          corepack prepare npm@10.9.8 --activate
          npm --version

      - name: Check package lock
        run: npm run lockfile:check

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Audit dependencies
        run: npm run audit

      - name: Lint
        run: npm run lint

      - name: Check docs links
        run: npm run docs:check

      - name: Run unit and route tests
        run: npm run test

      - name: Build
        run: npm run build

      - name: Run production smoke test
        run: npm run test:smoke

      - name: Run browser E2E
        run: npm run test:e2e
