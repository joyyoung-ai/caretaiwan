services:
  caretaiwan:
    image: caretaiwan:latest
    container_name: caretaiwan
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      AUTH_URL: "${PUBLIC_APP_URL}"
      NEXTAUTH_URL: "${PUBLIC_APP_URL}"
      PUBLIC_APP_URL: "${PUBLIC_APP_URL}"
      LOCAL_PHOTO_STORAGE_DIR: "/app/photo-storage"
    ports:
      - "${APP_PORT:-3033}:3000"
    volumes:
      - ./photo-storage:/app/photo-storage
